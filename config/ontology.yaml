version: "0.3"
relationship_contract:
  raw_relation_mappings:
    supplier_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: general supply}
    customer_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: subject_to_object, category: customer supply}
    manufacturing_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: contract manufacturing}
    foundry_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: semiconductor foundry}
    packaging_or_assembly_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: assembly, test and packaging}
    cloud_or_hosting_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: cloud or hosting}
    data_center_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: data center capacity}
    power_or_utility_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: power, utility or cooling}
    network_or_interconnection_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: network or interconnection}
    distribution_or_channel_dependency: {canonical_type: supplies_to, family: supply_chain, orientation: object_to_subject, category: distribution channel}
    licensing_dependency: {canonical_type: licenses_to, family: commercial_relationship, orientation: object_to_subject, category: technology license}
    asset_acquisition: {canonical_type: acquires_asset_from, family: corporate_transaction, orientation: object_to_subject}
    asset_divestiture: {canonical_type: acquires_asset_from, family: corporate_transaction, orientation: object_to_subject}
    business_combination: {canonical_type: acquires_company, family: corporate_transaction, orientation: subject_to_object}
    strategic_investment: {canonical_type: invests_in, family: corporate_transaction, orientation: subject_to_object}
    subsidiary_or_control: {canonical_type: controls, family: ownership_control, orientation: subject_to_object}
    strategic_partner: {canonical_type: partners_with, family: commercial_relationship, orientation: object_to_subject}
    co_investment: {canonical_type: co_invests_with, family: commercial_relationship, orientation: object_to_subject}
  canonical_types:
    supplies_to: {family: supply_chain, source_role: supplier, target_role: customer, default_map_layer: supply_chain, cross_filing_auto_accept: true}
    controls: {family: ownership_control, source_role: controller, target_role: controlled_entity, default_map_layer: ownership_control, cross_filing_auto_accept: true}
    acquires_asset_from: {family: corporate_transaction, source_role: acquirer, target_role: seller, default_map_layer: corporate_transaction, cross_filing_auto_accept: false}
    acquires_company: {family: corporate_transaction, source_role: acquirer, target_role: acquired_company, default_map_layer: corporate_transaction, cross_filing_auto_accept: false}
    invests_in: {family: corporate_transaction, source_role: investor, target_role: investee, default_map_layer: corporate_transaction, cross_filing_auto_accept: false}
    licenses_to: {family: commercial_relationship, source_role: licensor, target_role: licensee, default_map_layer: commercial_relationship, cross_filing_auto_accept: false}
    partners_with: {family: commercial_relationship, source_role: partner, target_role: partner, default_map_layer: commercial_relationship, cross_filing_auto_accept: false}
    co_invests_with: {family: commercial_relationship, source_role: co_investor, target_role: co_investor, default_map_layer: commercial_relationship, cross_filing_auto_accept: false}
  risk_flags:
    competitor_or_market_context: {blocks_cross_filing_auto_accept: true, truth_decision: false}
    direction_anomaly: {blocks_cross_filing_auto_accept: true, truth_decision: false}
    cross_sentence_attachment_risk: {blocks_cross_filing_auto_accept: true, truth_decision: false}
    product_or_service_not_extracted: {blocks_cross_filing_auto_accept: false, truth_decision: false}
    llm_proposed_direction_correction: {blocks_cross_filing_auto_accept: true, truth_decision: false}
parser_contract:
  required_provenance:
    - accession_number
    - cik
    - ticker
    - form
    - filing_date
    - accepted_timestamp
    - source_document_url
    - source_document
    - source_document_type
    - section
    - passage_id
    - paragraph_offset
    - evidence_text
    - parser_name
    - parser_version
    - extractor_model_version
    - confidence_score
modalities:
  current_fact: "Disclosed as a present operating relationship or dependency."
  historical_fact: "Disclosed as a past, terminated, or superseded relationship."
  risk_hypothetical: "Risk-factor or conditional language that describes possible future harm."
  forward_looking: "Plan, expectation, target, or intended future dependency."
  strategic: "Strategic partnership, investment, or formal collaboration."
relation_types:
  asset_acquisition:
    definition: "Subject acquires named assets or an operating business from a counterparty."
  asset_divestiture:
    definition: "Subject divests named assets or an operating business to a counterparty."
  business_combination:
    definition: "Subject acquires or merges with a named company."
  strategic_investment:
    definition: "Subject makes a named equity or strategic investment."
  supplier_dependency:
    definition: "Subject relies on a supplier or third-party provider for inputs, services, or components."
    include: ["supplier", "vendor", "third-party", "sole source", "limited number"]
    exclude: ["generic macro risk without an identifiable provider or dependency class"]
  customer_dependency:
    definition: "Subject depends on one or more customers for revenue, demand, or adoption."
    include: ["customer concentration", "major customer", "accounts for revenue"]
    exclude: ["generic customer demand statements without concentration or dependency"]
  manufacturing_dependency:
    definition: "Subject relies on outsourced manufacturing, contract manufacturing, or fabrication capacity."
    include: ["contract manufacturer", "manufacturing partner", "fabrication", "wafer"]
    exclude: ["internal manufacturing only"]
  foundry_dependency:
    definition: "Subject depends on semiconductor foundry capacity or technology."
    include: ["foundry", "wafer fabrication", "process node"]
    exclude: ["software hosting or cloud infrastructure"]
  packaging_or_assembly_dependency:
    definition: "Subject relies on outsourced packaging, advanced packaging, assembly, or test."
    include: ["advanced packaging", "assembly", "test", "OSAT"]
    exclude: ["generic product packaging for retail goods"]
  cloud_or_hosting_dependency:
    definition: "Subject relies on cloud, hosting, or hosted platform infrastructure."
    include: ["cloud", "hosting", "SaaS infrastructure", "AWS", "Azure", "Google Cloud"]
    exclude: ["cloud as a customer segment without operational reliance"]
  data_center_dependency:
    definition: "Subject relies on data center, colocation, compute capacity, or facilities."
    include: ["data center", "colocation", "compute capacity", "server capacity"]
    exclude: ["office facilities only"]
  power_or_utility_dependency:
    definition: "Subject depends on power, electricity, utility, cooling, or energy availability."
    include: ["electricity", "power", "utility", "cooling", "energy supply"]
    exclude: ["product power efficiency claims without supply exposure"]
  network_or_interconnection_dependency:
    definition: "Subject relies on network carriers, peering, interconnection, or connectivity."
    include: ["network", "interconnection", "peering", "carrier", "bandwidth"]
    exclude: ["general internet growth language"]
  distribution_or_channel_dependency:
    definition: "Subject relies on distributors, resellers, channels, app stores, or go-to-market partners."
    include: ["distributor", "reseller", "channel partner", "app store"]
    exclude: ["direct sales only"]
  strategic_partner:
    definition: "Subject has a strategic partnership or commercial collaboration."
    include: ["strategic partnership", "collaboration", "alliance", "joint development"]
    exclude: ["one-off supplier purchase without strategic language"]
  co_investment:
    definition: "Subject co-invests or jointly funds capacity, infrastructure, technology, or ventures."
    include: ["joint investment", "co-investment", "joint venture"]
    exclude: ["ordinary purchase orders"]
  licensing_dependency:
    definition: "Subject relies on licensed technology, IP, software, or content."
    include: ["license", "licensed technology", "intellectual property"]
    exclude: ["customer license revenue without dependency"]
  facility_or_geographic_exposure:
    definition: "Subject has exposure to specific facilities, regions, jurisdictions, or logistics corridors."
    include: ["facility", "geography", "Taiwan", "China", "export controls", "earthquake"]
    exclude: ["headquarters location only"]
  subsidiary_or_control:
    definition: "Subject controls, is controlled by, or materially depends on a subsidiary or affiliate."
    include: ["subsidiary", "affiliate", "control", "owned by"]
    exclude: ["unrelated legal boilerplate"]
  concentration_risk:
    definition: "Subject has high concentration in suppliers, customers, geography, products, or capacity."
    include: ["concentration", "limited number", "substantial portion", "single customer"]
    exclude: ["diversified exposure statements"]
merge_policy:
  version: "0.1"
  canonicalization:
    - "Normalize public-company aliases such as AWS/Amazon.com, Azure/Microsoft, GCP/Alphabet, and TSMC/Taiwan Semiconductor before aggregation."
    - "Strip common legal suffixes for merge keys while preserving display names."
    - "Keep raw relation_evidence_raw.jsonl for audit; graph edges use filtered relation_evidence.jsonl."
  graph_ready_rules:
    named_counterparty_required:
      - strategic_partner
      - co_investment
    class_objects_allowed_when_supported_by_text:
      - customer_dependency
      - manufacturing_dependency
      - foundry_dependency
      - packaging_or_assembly_dependency
      - data_center_dependency
      - power_or_utility_dependency
      - network_or_interconnection_dependency
      - distribution_or_channel_dependency
      - licensing_dependency
      - facility_or_geographic_exposure
      - concentration_risk
    restricted_generic_objects:
      supplier_dependency: "Recall-first: keep descriptive supplier classes when reliance, third-party, sole-source, limited-number, or concentration language is present."
      cloud_or_hosting_dependency: "Recall-first: keep descriptive cloud/hosting classes when third-party hosting, platform-provider, vendor-dependence, or interruption-risk language is present."
  bottleneck_policy:
    - "Do not rank generic dependency classes as shared bottlenecks."
    - "Rank named companies, organizations, facilities, or geographies by distinct dependent subjects and supporting evidence."
  optional_embedding_merge:
    model: "qwen3-embed-0.6b"
    default_threshold: 0.92
    usage: "Use for alias discovery after deterministic filtering; do not replace provenance or manual validation."
llm_extraction_policy:
  version: "0.3-recall"
  role: "Recall-first extractor. Prefer named objects, but output descriptive class-level exposure when no named counterparty is disclosed."
  sec_document_policy:
    - "Treat SEC archive primary filings and selected Exhibit 10/21/99.1 documents as source documents with their own provenance."
    - "Exhibit 10 material contracts are high-priority for named counterparties and agreement obligations, but boilerplate party references alone are not dependencies."
    - "Exhibit 21 subsidiary lists map to subsidiary_or_control only; do not infer operating dependencies from subsidiary names."
    - "Exhibit 99.1 earnings releases and investor materials are valid evidence for customer concentration, capacity, data center, cloud, power, supply-chain, strategic partnership, and geography exposure when explicit."
  object_policy:
    preferred:
      - named_company
      - named_org
      - geography
      - facility
      - anonymous_counterparty
      - subsidiary_or_affiliate
      - dependency_class
    disallowed_schema_label_objects:
      - manufacturing_dependency
      - concentration_risk
  precision_rules:
    - "Do not infer dependency from co-occurrence, market category, product description, competitor list, or broad industry context."
    - "Use current_fact only when present operating reliance is directly stated."
    - "Use risk_hypothetical for conditional risk-factor language unless the same sentence directly states present reliance."
    - "Require explicit strategic partnership, alliance, joint development, joint venture, or co-investment language for strategic_partner and co_investment."
    - "Drop strategic_partner and co_investment outputs unless modality is strategic."
    - "Customer concentration requires named customers, anonymous customer labels supported by percentages, or explicit limited-customer concentration language."
    - "When a dependency is directly disclosed but unnamed, output a descriptive class object rather than returning an empty array."
    - "Limit LLM output to the strongest eight relations per passage; malformed single-passage output must not crash batch extraction."
